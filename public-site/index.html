<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Mofune</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #3b322a;
        --paper: #f7f1e6;
        --accent: #e8a03c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        line-height: 1.8;
        padding: 1.5rem;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }
      .lead {
        margin: 0 0 2rem;
      }
      .note {
        font-size: 0.9rem;
        opacity: 0.75;
      }
      a {
        color: inherit;
        text-decoration-color: var(--accent);
        text-underline-offset: 0.2em;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #241f1a;
          color: #f7f1e6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mofune</h1>
      <p class="lead">グループのなかの連絡を、やわらかく、安全に。</p>
      <p class="note">
        紹介ページは準備中です。アプリは <a href="/app/">/app</a> で動作します。
        開発状況とドキュメントは
        <a href="https://github.com/kousuke-takeuchi/mofune">GitHub リポジトリ</a>
        にあります。
      </p>
    </main>
  </body>
</html>
